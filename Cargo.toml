[package]
name = "m0onpatcher"
version = "0.1.0"
edition = "2024"
description = "Standalone mod patcher for Course of Temptation (SugarCube / Twine): applies .mod files to a game HTML with the built-in Rust engine."

[package.metadata.bundle]
name = "M0on's patcher"
identifier = "tech.moonmoon.m0onpatcher"
category = "public.app-category.utilities"
short_description = "Mod patcher for Twine/SugarCube HTML games"
long_description = """
M0on's patcher applies .mod files (KittyPatcher format) to a Twine/SugarCube game HTML \
with a built-in Rust engine. No Python and no separate KittyPatcher are needed.
"""

[workspace]
members = ["xtask", "crates/kitty-engine"]

[dependencies]
kitty-engine = { path = "crates/kitty-engine" }
anyhow = "1"
log = "0.4"
regex = "1"
sha1 = "0.10"
tl = "0.7"
image = { version = "0.25", default-features = false, features = ["png"] }
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17"
# Match eframe 0.34's transitive winit: needed to force the X11 backend on Linux (winit's Wayland side has no drag-and-drop).
winit = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
