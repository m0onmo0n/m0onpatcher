[package]
name = "m0on-packer"
version = "0.1.0"
edition = "2024"

[package.metadata.bundle]
name = "M0on's packer & patcher"
identifier = "me.proton.nuqqur.screpacker"
category = "public.app-category.utilities"
short_description = "Twine/SugarCube HTML mod packer"
long_description = """
M0on's packer & patcher (a fork of nuqqur's ScRepacker) extracts Twine/SugarCube HTML games into editable source \
trees, applies .diff / .mod / KittyPatcher patches, and repacks the \
result back into a playable HTML file.
"""

[workspace]
members = ["xtask", "crates/kitty-engine"]

[dependencies]
kitty-engine = { path = "crates/kitty-engine" }
tl = "0.7"
regex = "1"
anyhow = "1"
sha1 = "0.10"
log = "0.4"
simplelog = "0.12"
flickzeug = "0.5"
diffy-imara = "0.3"
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17"
# Match eframe 0.34's transitive winit — we need direct access to force the
# X11 backend since winit's Wayland side has no drag-and-drop support.
winit = "0.30"
notify = "8"
tungstenite = "0.29"
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", default-features = false, features = ["formatting", "macros"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
